name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-14
    env:
      RELEASE_OUTPUT_DIR: ${{ github.workspace }}/.release/output
      RELEASE_BUILD_DIR: ${{ github.workspace }}/.release/build
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_PRIVATE_KEY_SECRET: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID_SECRET: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and release scripts
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "Release tags must point to a commit reachable from main." >&2
            exit 1
          }
          scripts/release/check-version.sh "${GITHUB_REF_NAME}"
          scripts/release/lint-shell.sh

      - name: Test core package
        run: swift test

      - name: Configure Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_P12 != '' }}
        run: |
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"

          identity="$(security find-identity -v -p codesigning "${keychain_path}" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [[ -z "${identity}" ]]; then
            echo "No Developer ID Application identity was imported." >&2
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=${identity}" >> "${GITHUB_ENV}"
          echo "MACOS_SIGNING_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Build universal app
        run: scripts/release/build-macos.sh "${GITHUB_REF_NAME}"

      - name: Configure App Store Connect key
        if: ${{ env.APPLE_API_PRIVATE_KEY_SECRET != '' && env.APPLE_API_KEY_ID_SECRET != '' && env.APPLE_API_ISSUER_ID_SECRET != '' }}
        run: |
          private_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
          printf '%s' "${APPLE_API_PRIVATE_KEY_SECRET}" > "${private_key_path}"
          chmod 600 "${private_key_path}"
          echo "APPLE_API_KEY_PATH=${private_key_path}" >> "${GITHUB_ENV}"
          echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID_SECRET}" >> "${GITHUB_ENV}"
          echo "APPLE_API_ISSUER_ID=${APPLE_API_ISSUER_ID_SECRET}" >> "${GITHUB_ENV}"

      - name: Notarize app when credentials are configured
        run: |
          if [[ -n "${MACOS_SIGNING_IDENTITY:-}" && -n "${APPLE_API_KEY_PATH:-}" ]]; then
            scripts/release/notarize-macos.sh "${RELEASE_BUILD_DIR}/Mac Directory Statistics.app"
            echo "EXPECT_NOTARIZED=1" >> "${GITHUB_ENV}"
          else
            echo "Apple Developer ID notarization credentials are not configured; publishing an ad-hoc-signed preview."
            echo "EXPECT_NOTARIZED=0" >> "${GITHUB_ENV}"
          fi

      - name: Package DMG and ZIP
        run: scripts/release/package-macos.sh "${GITHUB_REF_NAME}"

      - name: Notarize disk image when credentials are configured
        run: |
          if [[ "${EXPECT_NOTARIZED}" == "1" ]]; then
            scripts/release/notarize-macos.sh "${RELEASE_OUTPUT_DIR}/Mac-Directory-Statistics-${GITHUB_REF_NAME}-macOS-universal.dmg"
          fi

      - name: Create checksums and verify artifacts
        run: |
          scripts/release/checksum-macos.sh "${GITHUB_REF_NAME}"
          scripts/release/verify-macos.sh "${GITHUB_REF_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Directory-Statistics-${{ github.ref_name }}-macOS-universal
          path: |
            ${{ env.RELEASE_OUTPUT_DIR }}/*.dmg
            ${{ env.RELEASE_OUTPUT_DIR }}/*.zip
            ${{ env.RELEASE_OUTPUT_DIR }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/publish-github.sh "${GITHUB_REF_NAME}"
